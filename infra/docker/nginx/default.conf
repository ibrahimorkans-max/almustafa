# Development vhost. The production (Hostinger VPS) config with TLS 1.3 + HSTS comes in phase 9.
server {
    listen 80;
    server_name _;
    root /var/www/app/public;          # web root is /public only; .env is never reachable
    index index.php;

    client_max_body_size 25m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles (.env, .git, …)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
