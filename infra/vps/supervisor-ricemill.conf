[program:ricemill-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /srv/ricemill/current/app/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=/srv/ricemill/current/app
user=ricemill
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/srv/ricemill/shared/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
