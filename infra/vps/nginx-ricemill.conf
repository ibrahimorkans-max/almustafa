# Rice Mill ERP — nginx site. {{DOMAIN}}, {{PHP}}, {{CERT}} and {{KEY}} are filled in by provision.sh.
limit_req_zone $binary_remote_addr zone=ricemill_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ricemill_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # Mill server: the mill's certificate, downloaded over HTTP once per device (it is public).
    location = /mill-ca.crt { root /var/www/html; default_type application/x-x509-ca-cert; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{DOMAIN}};
    root /srv/ricemill/current/app/public;
    index index.php;

    ssl_certificate {{CERT}};
    ssl_certificate_key {{KEY}};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # The application sends CSP, HSTS and frame headers itself; these are defence in depth.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    client_max_body_size 20m;          # weighbridge photos, lab reports, bank files
    access_log /var/log/nginx/ricemill-access.log;
    error_log /var/log/nginx/ricemill-error.log warn;

    # Never serve dotfiles (the .env link) or anything outside public/.
    location ~ /\.(?!well-known) { deny all; }

    location = /admin/login { limit_req zone=ricemill_login burst=10 nodelay; try_files $uri /index.php?$query_string; }
    location ^~ /api/ { limit_req zone=ricemill_api burst=40 nodelay; try_files $uri /index.php?$query_string; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|ico|webmanifest)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php{{PHP}}-fpm-ricemill.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root resolves the `current` symlink, so a deploy switches atomically.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        internal;
    }
    location ~ \.php$ { return 404; }
}
