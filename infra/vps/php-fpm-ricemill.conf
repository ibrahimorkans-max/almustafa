; Rice Mill ERP PHP-FPM pool ({{PHP}} is filled in by provision.sh)
[ricemill]
user = ricemill
group = ricemill
listen = /run/php/php{{PHP}}-fpm-ricemill.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 120s

; Nothing from the server environment leaks into PHP; Laravel reads its .env.
clear_env = yes
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 22M
php_admin_value[memory_limit] = 256M
