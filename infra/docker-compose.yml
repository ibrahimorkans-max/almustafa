# Local development stack: php-fpm, nginx, PostgreSQL 17, Redis 7, queue worker, scheduler.
#
#   cp app/.env.example app/.env        # then set APP_KEY / DB_PASSWORD (see infra/README.md)
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml exec app php artisan migrate --seed
#   open http://localhost:8080/admin
#
# The application connects as `ricemill`, a NON-superuser role (created by db/init).
# PostgreSQL superusers bypass row-level security, so never point the app at `postgres`.

name: ricemill

x-app: &app
  build:
    context: ..
    dockerfile: infra/docker/php/Dockerfile
  env_file: ../app/.env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ricemill
    DB_USERNAME: ricemill
    DB_PASSWORD: ${RICEMILL_DB_PASSWORD:-ricemill-local-only}
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
  volumes:
    - ../app:/var/www/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../app:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres-local-only}
      RICEMILL_DB_PASSWORD: ${RICEMILL_DB_PASSWORD:-ricemill-local-only}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
