# Copy to agent.toml (never commit it) and restrict it to the agent's service account.
# Secrets can instead come from RICEMILL_AGENT_PASSWORD / RICEMILL_AGENT_SIGNING_SECRET / RICEMILL_AGENT_STORE_KEY.

[server]
url = "https://erp.example.in"          # HTTPS required (http://127.0.0.1 allowed for local testing)

[auth]
username = "wb.agent"                  # a GATE_OPERATOR login account reserved for this PC
password = ""                          # `ricemill-agent protect` → "dpapi:…", or RICEMILL_AGENT_PASSWORD
device_uid = "agent-xxxxxxxxxxxxxxxxxxxxxxxx"   # shown once by Devices → "Register gate agent"
signing_secret = ""                    # shown once with the device_uid; protect it ("dpapi:…") or use the env variable

[store]
path = "C:/ProgramData/RiceMillAgent/store.sqlite3"
key = ""                               # `ricemill-agent new-store-key`, then protect it ("dpapi:…") or use RICEMILL_AGENT_STORE_KEY

[scale]
id = ""                                # Weighbridges → copy the scale's id
resolution_kg = "10"
min_stable_samples = 6

[indicator]
# Easiest: plug the cable in and run `ricemill-agent --config agent.toml detect --write`; it fills this section.
type = "simulated"                     # simulated | serial | tcp
# port = "COM3"                        # serial: see `ricemill-agent ports`
# baudrate = 9600                      # PF-7E and most indicators: 9600 (also 4800, 2400, 1200)
# format = "standard"                  # standard | st_gs | reversed  (reversed = "=0.84520" Yaohua-style output)
# bytesize = 8
# parity = "none"                      # none | even | odd
# stopbits = 1
# host = "192.168.1.50"                # tcp (network indicator or RS232-to-Ethernet converter)
# port = 4001
# frame_pattern = '(?P<sign>[+-])?\s*0*(?P<weight>\d+)\s*(?P<unit>kg)'   # only for unusual indicators

[camera]
type = "simulated"                     # simulated | usb | rtsp | http | none   (usb and rtsp need ffmpeg)
# device = "USB2.0 HD UVC WebCam"      # usb: the name `ricemill-agent cameras` prints
# url = "rtsp://admin:PASSWORD@192.168.1.64:554/Streaming/Channels/101"   # rtsp: IP camera / DVR (Hikvision style)
# url = "rtsp://admin:PASSWORD@192.168.1.64:554/cam/realmonitor?channel=1&subtype=0"   # rtsp: Dahua style
# url = "http://192.168.1.60/cgi-bin/snapshot.cgi"   # http: camera with a snapshot address
# ffmpeg = "C:/ffmpeg/bin/ffmpeg.exe"  # only if ffmpeg is not on the PATH

[anpr]
type = "none"                          # none | simulated | http
# result_url = "http://192.168.1.61/api/plate/latest"   # JSON {"plate": "...", "confidence": 0.97}
# snapshot_url = "http://192.168.1.61/cgi-bin/snapshot.cgi"

[barrier]
type = "simulated"                     # simulated | tcp  (opens only on the server's yes; fails closed)
# host = "192.168.1.70"
# port = 4002
# open_command = "OPEN\n"
# close_command = "CLOSE\n"

[display]
type = "none"                          # none | simulated | tcp
# host = "192.168.1.71"
# port = 4003
# width = 16
